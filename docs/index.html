<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      loadSidebar: true,
      relativePath: true,
      name: 'Projeto G4 - Jogo',
      repo: 'https://github.com/UnBArqDsw2026-2-Turma02/2026.2-T02-_G4_ProjetoJogo_Entrega_01'
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script>
    function getSidebarGroupTitle(group) {
      return group.querySelector(':scope > strong, :scope > p > strong');
    }

    function setupSidebarDropdowns() {
      var groups = document.querySelectorAll('.sidebar-nav > ul > li');

      groups.forEach(function (group) {
        var title = getSidebarGroupTitle(group);
        var nestedList = group.querySelector(':scope > ul');

        if (!title || !nestedList || title.dataset.dropdownReady === 'true') {
          return;
        }

        title.dataset.dropdownReady = 'true';
        title.setAttribute('role', 'button');
        title.setAttribute('tabindex', '0');
        title.setAttribute('aria-expanded', 'true');
        group.classList.add('sidebar-dropdown', 'is-open');

        function toggleGroup() {
          var isOpen = group.classList.toggle('is-open');
          title.setAttribute('aria-expanded', String(isOpen));
        }

        title.addEventListener('click', toggleGroup);
        title.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggleGroup();
          }
        });
      });
    }

    window.$docsify.plugins = [].concat(window.$docsify.plugins || [], function (hook) {
      hook.doneEach(setupSidebarDropdowns);
    });

    document.addEventListener('DOMContentLoaded', setupSidebarDropdowns);

    new MutationObserver(setupSidebarDropdowns).observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>
</body>
</html>
